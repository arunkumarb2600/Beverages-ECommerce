# Database configuration
# Local default below; production (Render + Aiven) sets DB_URL / DB_USERNAME / DB_PASSWORD.
# Aiven requires SSL, so the production DB_URL uses: ?sslMode=REQUIRED&serverTimezone=UTC
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/refreshup?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Arun@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Configuration (Render injects a PORT env var in production)
server.port=${PORT:8080}

# Actuator health endpoint (used by Render's health check)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
# Render free tier cannot always reach Gmail SMTP; keep health green based on DB + disk only
management.health.mail.enabled=false

# JWT Secret Key (HMAC SHA-256 secure key encoded in base64)
# Production: set a strong random JWT_SECRET env var (e.g. `openssl rand -hex 32`)
jwt.secret=${JWT_SECRET:9a6563c713b5e48d3df243c3f912e742880b9c02d1d0ee136aa9d2c20a1f0a2e}
# JWT Expiration: 24 hours (86,400,000 milliseconds)
jwt.expiration=86400000
# JWT Expiration when "Remember Me" is checked: 7 days (604,800,000 milliseconds)
jwt.remember-me-expiration=604800000

# =====================================================================
# Email (SMTP) configuration
# Credentials are read from environment variables (MAIL_HOST / MAIL_PORT /
# MAIL_USERNAME / MAIL_PASSWORD / MAIL_FROM) with defaults below, so the app
# works regardless of how it is launched. Environment variables always take
# precedence over these defaults.
#
# Gmail SMTP is blocked from cloud providers like Render (connection timeout).
# For production use a transactional provider that allows cloud egress:
#   Brevo   -> host smtp-relay.brevo.com,  port 587 (starttls), 300/day free
#   SendGrid-> host smtp.sendgrid.net,    port 587 (starttls), 100/day free
# Set MAIL_USE_SSL=true when the port requires implicit SSL (e.g. Gmail 465).
# =====================================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:ab5171439@gmail.com}
spring.mail.password=${MAIL_PASSWORD:ahqqwohqbertbguv}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_USE_SSL:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_USE_TLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=20000
spring.mail.properties.mail.smtp.timeout=20000
spring.mail.properties.mail.smtp.writetimeout=20000
spring.mail.from=${MAIL_FROM:ab5171439@gmail.com}

# OTP policy
app.otp.expiry-minutes=5
app.otp.resend-interval-seconds=60
app.otp.max-resends=5

# =====================================================================
# Razorpay Payment Gateway (test mode by default)
# Production: set RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET to live keys.
#   razorpay.key.id     = test key id   (safe to expose to the frontend)
#   razorpay.key.secret = test key secret (MUST never be exposed to the frontend)
# =====================================================================
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_TLFkAxQT0uHeGG}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:9SNr5zN3QypiD9vKczHpL8jP}

# Enable request payload validation logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LEVEL:DEBUG}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${HIBERNATE_BINDER_LEVEL:TRACE}
